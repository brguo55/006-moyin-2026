<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>听雨</title>
<meta name="description" content="听雨 · 一边听雨一边做事：任务、番茄钟、习惯打卡。数据只存在你自己的电脑里。">
<meta name="theme-color" content="#f3ecdd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc@5.3.0/index.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="c"></canvas>
<!--
  听雨（纯前端 PWA，零依赖、无构建；数据存在本机 IndexedDB）
    js/stage/              背景舞台（像素风）：房子的地图与操作（room.js）、房子的画（house.js）、
                           rabbit 和小鸟的帧（sprites.js、assets/rabbit/）、像素小工具（pixel.js）、色板、静音、声音
    js/app/util.js         DOM 小工具 / 日期
    js/app/store.js        数据：IndexedDB 读写、版本升级
    js/app/backup.js       备份：自动备份到文件夹 / 导出导入 / 状态
    js/app/schedule.js     任务的时间、提醒、重复
    js/app/tasks.js        任务（子任务、标签、今天至少完成）
    js/app/matrix.js       轻重（四象限）
    js/app/pomodoro.js     番茄钟
    js/app/habits.js       习惯打卡
    js/app/countdown.js    倒数日
    js/app/diary.js        日记
    js/app/ticktick.js     从滴答清单导入
    js/app/settings.js     设置页
    js/app/app.js          面板外壳与启动
    sw.js                  离线缓存
-->
<script src="js/stage/engine.js"></script>
<script src="js/stage/palette.js"></script>
<script src="js/stage/pixel.js"></script>
<script src="js/stage/sprites.js"></script>
<script src="js/stage/room.js"></script>
<script src="js/stage/house.js"></script>
<script src="js/stage/ui.js"></script>
<script src="js/stage/audio.js"></script>
<script src="js/stage/main.js"></script>
<script src="js/app/util.js"></script>
<script src="js/app/store.js"></script>
<script src="js/app/backup.js"></script>
<script src="js/app/schedule.js"></script>
<script src="js/app/tasks.js"></script>
<script src="js/app/matrix.js"></script>
<script src="js/app/pomodoro.js"></script>
<script src="js/app/habits.js"></script>
<script src="js/app/countdown.js"></script>
<script src="js/app/diary.js"></script>
<script src="js/app/ticktick.js"></script>
<script src="js/app/settings.js"></script>
<script src="js/app/app.js"></script>
</body>
</html>
